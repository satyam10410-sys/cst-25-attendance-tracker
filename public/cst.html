<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CST Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;600&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link rel="icon" type="img/png" href="ct.jpg">
</head>

<body>
    <div class="container">
        <div class="login-card">
            <h1>CST'25 LOGIN PAGE</h1>

            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <input type="text" id="roll" placeholder="Roll no." name="roll" required>
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" name="pwd" required>
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password" aria-pressed="false">
                        <svg class="eye-icon eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-icon eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.62 21.62 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>

                <div class="input-group select-group">
                    <label for="hsElective" class="select-label">Choose Your Elective</label>
                    <div class="select-wrapper">
                        <select id="hsElective" name="hsElective" required>
                            <option value="" disabled selected>Select your HS elective</option>
                            <option value="hs2110">Language, Human Mind and Indian Society (HS2110)</option>
                            <option value="hs2111">Sociology (HS2111)</option>
                            <option value="hs2112">Demography (HS2112)</option>
                        </select>
                        <svg class="select-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                    </div>
                    <p class="select-locked-note" id="electiveLockedNote" hidden>You've already chosen your elective for this session — logging out won't let you change it.</p>
                </div>

                <div class="remember-row">
                    <label class="checkbox-container">
                        <input type="checkbox" id="me" name="me">
                        <span>Remember me</span>
                    </label>
                    <a href="https://wa.me/+919334577881" target="_blank" rel="noopener noreferrer" class="forgot-link">Forgot Password?</a>
                </div>

                <div class="terms">
                    <label class="checkbox-container">
                        <input type="checkbox" id="tc" name="tc">
                        <span>I agree to the terms and conditions</span>
                    </label>
                </div>

                <!-- Change this line -->
                <button type="submit" id="loginBtn" class="login-btn">
                    <span class="btn-spinner" id="loginSpinner" aria-hidden="true"></span>
                    <span id="loginBtnText">Log In</span>
                </button>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <footer>
        Crafted, Designed, Scripted, Baked and Coded with 💙 by &lt; Satyam  Kumar city="Patna" / &gt;;
    </footer>

    <script type="module" src="cst.js"></script>
</body>

</html>
